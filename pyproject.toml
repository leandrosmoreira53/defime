[project]
name = "defime"
version = "0.1.0"
description = "DeFi analytics engine for Uniswap V3/V4 liquidity on Robinhood Chain: event indexers, V3 math, real LP fee, RWA pool heatmap."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "eth-abi>=5",
  "eth-utils>=4",
  "httpx>=0.27",
  "pycryptodome>=3.19",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
postgres = ["psycopg[binary]>=3.1"]
# universo RWA (defime.jobs.rwa) usa o cliente do mcp-defime: DexScreener, GeckoTerminal e on-chain
rwa = ["mcp-defime @ git+https://github.com/leandrosmoreira53/mcp-defime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/defime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
